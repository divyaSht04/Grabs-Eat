name: Frontend CI Pipeline

on:
  push:
    branches: [ main, develop, 'feat/**' ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  test:
    name: Build and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🔍 Verify Node and npm
        working-directory: ./frontend
        run: |
          node --version
          npm --version

      - name: 📥 Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔍 TypeScript Type Check
        working-directory: ./frontend
        run: npm run type-check

      - name: 🎨 Prettier Format Check
        working-directory: ./frontend
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css,json}"

      - name: 🔍 ESLint Check
        working-directory: ./frontend
        run: npm run lint

      - name: 📦 Build Application
        working-directory: ./frontend
        run: npm run build

      - name: 📊 Build Size Analysis
        working-directory: ./frontend
        run: |
          echo "### 📊 Build Output Size" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          du -h dist/* | sort -hr >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

      - name: ✅ CI Summary
        if: success()
        run: |
          echo "### ✅ Frontend CI Pipeline - SUCCESS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 All checks passed!" >> $GITHUB_STEP_SUMMARY
          echo "✅ TypeScript compilation successful" >> $GITHUB_STEP_SUMMARY
          echo "✅ Code formatting verified" >> $GITHUB_STEP_SUMMARY
          echo "✅ ESLint checks passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Production build successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: ❌ CI Failure Summary
        if: failure()
        run: |
          echo "### ❌ Frontend CI Pipeline - FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️  One or more checks failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above and fix the failing checks." >> $GITHUB_STEP_SUMMARY

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 📊 Generate ESLint Report
        working-directory: ./frontend
        run: |
          npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-report.json || true

      - name: 📤 Upload ESLint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: frontend/eslint-report.json
          retention-days: 30

      - name: 📊 Code Quality Summary
        if: always()
        working-directory: ./frontend
        run: |
          echo "### 📊 Code Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Code quality analysis completed" >> $GITHUB_STEP_SUMMARY
          echo "📄 ESLint report generated and uploaded" >> $GITHUB_STEP_SUMMARY

  dependency-check:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🔒 Run npm audit
        working-directory: ./frontend
        run: |
          npm audit --json > audit-report.json || true
          npm audit || echo "⚠️  Security vulnerabilities found (review required)"

      - name: 📤 Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/audit-report.json
          retention-days: 30

      - name: 📊 Dependency Check Summary
        if: always()
        run: |
          echo "### 🔒 Dependency Security Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security audit completed - check artifacts for details" >> $GITHUB_STEP_SUMMARY

  lighthouse:
    name: Performance & Accessibility Check
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 📦 Build Application
        working-directory: ./frontend
        run: npm run build

      - name: 🚀 Serve Build
        working-directory: ./frontend
        run: |
          npm install -g serve
          serve -s dist -l 3000 &
          sleep 5

      - name: 🔍 Install Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x

      - name: 🎯 Run Lighthouse
        run: |
          lhci autorun --collect.url=http://localhost:3000 || echo "⚠️  Lighthouse checks completed with warnings"

      - name: 📊 Performance Summary
        if: always()
        run: |
          echo "### 🎯 Performance & Accessibility" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Lighthouse audit completed for PR" >> $GITHUB_STEP_SUMMARY
