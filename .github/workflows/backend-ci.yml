name: Backend CI Pipeline

on:
  push:
    branches: [ main, develop, 'feat/**' ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: grabeat_test
          POSTGRES_USER: grabeat_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔍 Verify Maven Installation
        working-directory: ./backend
        run: mvn --version

      - name: 📦 Compile Code
        working-directory: ./backend
        run: mvn clean compile -DskipTests

      - name: 🧪 Run Unit Tests
        working-directory: ./backend
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/grabeat_test
          SPRING_DATASOURCE_USERNAME: grabeat_user
          SPRING_DATASOURCE_PASSWORD: test_password

      - name: 📊 Generate Test Report
        if: always()
        working-directory: ./backend
        run: mvn surefire-report:report

      - name: 📈 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/
          retention-days: 30

      - name: 📊 Generate Code Coverage Report
        working-directory: ./backend
        run: mvn jacoco:report

      - name: 📈 Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/target/site/jacoco/
          retention-days: 30

      - name: 📊 Check Code Coverage Threshold
        working-directory: ./backend
        run: |
          mvn jacoco:check || echo "⚠️  Coverage threshold not met (continuing)"

      - name: 📦 Package Application
        if: success()
        working-directory: ./backend
        run: mvn package -DskipTests

      - name: 📤 Upload JAR Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

      - name: ✅ CI Summary
        if: success()
        run: |
          echo "### ✅ Backend CI Pipeline - SUCCESS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 All tests passed!" >> $GITHUB_STEP_SUMMARY
          echo "📦 Application packaged successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: ❌ CI Failure Summary
        if: failure()
        run: |
          echo "### ❌ Backend CI Pipeline - FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️  Tests failed or build error occurred" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the test results and fix the failing tests." >> $GITHUB_STEP_SUMMARY

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔍 Run Checkstyle
        working-directory: ./backend
        run: mvn checkstyle:check || echo "⚠️  Checkstyle warnings found (not blocking)"

      - name: 📊 Generate Checkstyle Report
        if: always()
        working-directory: ./backend
        run: mvn checkstyle:checkstyle

      - name: 📤 Upload Checkstyle Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: backend/target/site/checkstyle.html
          retention-days: 30

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔒 Run OWASP Dependency Check
        working-directory: ./backend
        run: mvn org.owasp:dependency-check-maven:check || echo "⚠️  Security vulnerabilities found (review required)"

      - name: 📤 Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: backend/target/dependency-check-report.html
          retention-days: 30
